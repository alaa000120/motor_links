<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7f3">
  <title>Rihla Express | تواصل معنا</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: linear-gradient(145deg, #edf4eb, #f8faf7);
      font-family: Arial, Tahoma, sans-serif;
      color: #183328;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 28px 22px;
      background: #fff;
      border: 1px solid #e0e8df;
      border-radius: 24px;
      box-shadow: 0 12px 35px rgba(21, 63, 46, 0.09);
      text-align: center;
    }

    .logo {
      display: block;
      width: 100%;
      max-width: 270px;
      height: auto;
      margin: 0 auto 12px;
      object-fit: contain;
    }

    h1 {
      margin: 8px 0;
      color: #214b34;
      font-size: 30px;
      direction: ltr;
    }

    .subtitle {
      margin: 0 0 25px;
      color: #718075;
      font-size: 15px;
      line-height: 1.8;
    }

    .links {
      display: grid;
      gap: 14px;
    }

    .button {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 58px;
      padding: 15px;
      border-radius: 14px;
      color: white;
      text-decoration: none;
      font-size: 17px;
      font-weight: bold;
      transition: opacity 0.2s;
    }

    .button:hover {
      opacity: 0.9;
    }

    .whatsapp {
      background: #218c50;
    }

    .instagram {
      background: linear-gradient(110deg, #833ab4, #c13584, #e6683c);
    }

    footer {
      margin-top: 25px;
      color: #91a096;
      font-size: 12px;
      direction: ltr;
    }
  </style>
</head>

<body>
  <main class="card">

    <img
      class="logo"
      src="logo.jpg"
      alt="Rihla Express Logo"
    >


    <p class="subtitle">
      يسعدنا تواصلكم معنا
    </p>

    <nav class="links">

      <a
        class="button whatsapp"
        href="https://wa.me/963997171712"
        target="_blank"
        rel="noopener noreferrer"
      >
        تواصل معنا عبر WhatsApp
      </a>

      <a
        class="button instagram"
        href="https://www.instagram.com/rihlaexpress/"
        target="_blank"
        rel="noopener noreferrer"
      >
        تابعنا على Instagram
      </a>

    </nav>

    <footer>
      RIHLA EXPRESS · CONNECT WITH US
    </footer>

  </main>
</body>
</html>
