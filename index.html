<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101010">
  <meta name="description" content="Rihla Express - تواصل معنا عبر واتساب وتابعنا على إنستغرام">
  <title>Rihla Express | رحلة إكسبريس</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at top, #343027 0%, #171717 48%, #080808 100%);
      color: #fff;
      font-family: Arial, Tahoma, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 390px;
      padding: 38px 24px 28px;
      text-align: center;
      border: 1px solid #a88b4a;
      border-radius: 24px;
      background: rgba(18, 18, 18, .94);
      box-shadow: 0 15px 50px rgba(0, 0, 0, .45);
    }

    .logo {
      width: 88px;
      height: 88px;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #d4b36a;
      border-radius: 50%;
      color: #e5c579;
      font-size: 30px;
      font-weight: 900;
      letter-spacing: -2px;
    }

    h1 {
      margin: 0;
      font-size: 29px;
      letter-spacing: 1px;
    }

    .arabic {
      margin: 9px 0 8px;
      color: #e1c47f;
      font-size: 19px;
      font-weight: bold;
    }

    .subtitle {
      margin: 0 0 28px;
      color: #c3c3c3;
      font-size: 14px;
      line-height: 1.8;
    }

    .link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      min-height: 58px;
      margin: 14px 0;
      padding: 15px;
      border-radius: 13px;
      text-decoration: none;
      font-size: 17px;
      font-weight: bold;
      transition: transform .2s;
    }

    .link:active { transform: scale(.98); }

    .whatsapp {
      background: #25D366;
      color: #071b0e;
    }

    .instagram {
      background: linear-gradient(110deg, #feda75, #fa7e1e, #d62976, #962fbf);
      color: #fff;
    }

    .icon {
      font-size: 23px;
    }

    .footer {
      margin-top: 27px;
      padding-top: 18px;
      border-top: 1px solid #39352b;
      color: #a9a9a9;
      font-size: 12px;
      letter-spacing: 1px;
    }

    .footer span { color: #d4b36a; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">RE</div>

    <h1>RIHLA EXPRESS</h1>
    <p class="arabic">رحلة إكسبريس</p>
    <p class="subtitle">
      أهلاً وسهلاً فيكم<br>
      تواصلوا معنا وتابعونا عبر حساباتنا الرسمية
    </p>

    <a class="link whatsapp"
       href="https://wa.me/963997171712"
       target="_blank" rel="noopener noreferrer">
      <span class="icon">☏</span>
      تواصل معنا عبر واتساب
    </a>

    <a class="link instagram"
       href="https://www.instagram.com/rihlaexpress/"
       target="_blank" rel="noopener noreferrer">
      <span class="icon">◎</span>
      تابعنا على إنستغرام
    </a>

    <div class="footer">
      <span>RIHLA EXPRESS</span>
      <p>شكراً لثقتكم بنا</p>
    </div>
  </main>
</body>
</html>
